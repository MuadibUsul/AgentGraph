name: agentgraph

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-agentgraph}
    # WAL archiving for point-in-time recovery (AG-ST-10): set PG_ARCHIVE_MODE=on
    # and restart the db service. Segments go to the wal-archive volume; mount
    # it from storage other than the database disk.
    command:
      - postgres
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-off}
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
      - -c
      - archive_timeout=900
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${WAL_ARCHIVE_DIR:-./backups/wal}:/wal-archive
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentgraph} -d ${POSTGRES_DB:-agentgraph}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768m

  api:
    image: agentgraph:3.2.1
    build: .
    container_name: agentgraph-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentgraph}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-agentgraph}
      ENVIRONMENT: production
      AUTO_INIT_DB: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MCP_ENABLED: "true"
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-[]}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-[]}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      RLS_ENABLED: "true"
      RLS_ROLE: agentgraph_app
      OUTBOUND_ALLOW_PRIVATE_NETWORKS: "false"
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:-[]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Backups (AG-ST-10): archives go to /backups, mounted from BACKUP_HOST_DIR.
      # Point it at storage other than the database disk, or set
      # BACKUP_UPLOAD_COMMAND to copy each run off the machine.
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_UPLOAD_COMMAND: ${BACKUP_UPLOAD_COMMAND:-}
      STAGING_DATABASE_URL: ${STAGING_DATABASE_URL:-}
      SECURITY_CONTACT: ${SECURITY_CONTACT:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups/agentgraph}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024m

networks:
  internal:
    name: agentgraph_internal
  web:
    external: true

volumes:
  pgdata:
    name: agentgraph_pgdata
